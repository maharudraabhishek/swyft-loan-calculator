# CI
#
# Checks every push to master and every pull request with the same checks as
# `pnpm verify`: format, lint, typecheck, build and all the tests. Linux runs everything
# that needs PostgreSQL (in Docker); Windows runs the desktop tests, since that's the
# platform the app ships for. It doesn't build installers or upload anything.
#
# How to run: it runs on its own. To re-run it, open the run and use "Re-run jobs".
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (Linux + PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: Database tests (PostgreSQL 17, roles and row-level security)
        run: pnpm test:db
      - name: Real-stack tests (desktop UI and Main against the real API)
        run: pnpm test:integration
      - name: Unit tests
        run: pnpm -r --filter '!@swyft/finance' run test
      # Expected to fail. 5 of the 8 official test-cases.json cases contradict the brief's
      # formulas (see Finance validation in the README), so this step
      # fails and Vitest adds a red annotation for each of the five. That is expected:
      # continue-on-error lets the job pass. The next step is the real check. It fails
      # on any other finance failure, or if the differences in those five cases change.
      - name: Official fixtures (5 known failures, expected, allowed to pass)
        continue-on-error: true
        run: |
          echo "::notice title=Official fixtures::5 of the 8 official test cases fail as expected (see Finance validation in the README). The red annotations from this step are expected and don't fail the job."
          pnpm --filter @swyft/finance exec vitest run tests/upstream-fixtures.test.ts
      - name: Finance tests (only the five documented official cases may differ)
        run: node scripts/check-finance.mjs
      - name: Launcher tests
        run: python3 -m unittest discover scripts

  windows:
    name: Desktop tests (Windows)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @swyft/desktop test
      - name: Launcher tests
        run: python -m unittest discover scripts
