# A version tag (vX.Y.Z) builds the Windows installer and the macOS disk images, then
# uploads them with SHA-256 checksums straight from each runner to the release bucket in
# Google Cloud Storage (gs://<bucket>/desktop/<tag>/). The Windows job also publishes the
# automatic-update feed (gs://<bucket>/desktop/updates/win/). No GitHub artifact storage
# is used. The runner signs in to Google Cloud with GitHub's short-lived OIDC
# token (Workload Identity Federation), so no key is stored in GitHub.
#
# Running it by hand (Actions → Release → Run workflow) builds without uploading.
#
# Repository variables (Settings → Secrets and variables → Actions → Variables):
#   GCP_WORKLOAD_IDENTITY_PROVIDER  projects/<number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
#   GCP_RELEASE_SERVICE_ACCOUNT     service account allowed to create objects in the bucket
#   GCP_RELEASE_BUCKET              bucket name, without gs://
name: Release
run-name: ${{ github.event_name == 'push' && format('Release {0}', github.ref_name) || format('Test build from {0} (no upload)', github.ref_name) }}

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2025
            script: desktop:package:win
            pattern: '*.exe'
          - name: macOS
            os: macos-15
            script: desktop:package:mac
            pattern: '*.dmg'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # lets google-github-actions/auth request the OIDC token
    env:
      UPLOAD: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check the tag matches the app version
        if: env.UPLOAD == 'true'
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match apps/desktop/package.json version $version"
            exit 1
          fi

      # Builds against the public API origin in apps/desktop/.env.production.
      - run: pnpm run ${{ matrix.script }}

      - name: Collect installers and SHA-256 checksums
        shell: bash
        run: |
          mkdir release
          cp apps/desktop/dist/${{ matrix.pattern }} release/
          cd release
          for file in *; do
            if command -v sha256sum > /dev/null; then
              sha256sum "$file" > "$file.sha256"
            else
              shasum -a 256 "$file" > "$file.sha256"
            fi
          done
          ls -l
          cat ./*.sha256

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: env.UPLOAD == 'true'
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_RELEASE_SERVICE_ACCOUNT }}
      # The service account can create objects but not replace or delete them, so a
      # published installer can never be overwritten. The one exception is the update
      # feed's latest.yml, which each release replaces.
      - uses: google-github-actions/upload-cloud-storage@6397bd7208e18d13ba2619ee21b9873edc94427a # v3.0.0
        if: env.UPLOAD == 'true'
        with:
          path: release
          destination: ${{ vars.GCP_RELEASE_BUCKET }}/desktop/${{ github.ref_name }}
          parent: false
          gzip: false
          process_gcloudignore: false

      # Automatic updates (Windows): installer and blockmap first, latest.yml last, so an
      # app never reads a latest.yml whose installer is not there yet.
      - name: Collect the update feed
        if: env.UPLOAD == 'true' && matrix.name == 'Windows'
        shell: bash
        run: |
          mkdir -p feed/files feed/manifest
          cp apps/desktop/dist/*.exe apps/desktop/dist/*.exe.blockmap feed/files/
          cp apps/desktop/dist/latest.yml feed/manifest/
          grep -q "^version: ${GITHUB_REF_NAME#v}$" feed/manifest/latest.yml
          cat feed/manifest/latest.yml
      - uses: google-github-actions/upload-cloud-storage@6397bd7208e18d13ba2619ee21b9873edc94427a # v3.0.0
        if: env.UPLOAD == 'true' && matrix.name == 'Windows'
        with:
          path: feed/files
          destination: ${{ vars.GCP_RELEASE_BUCKET }}/desktop/updates/win
          parent: false
          gzip: false
          process_gcloudignore: false
      - uses: google-github-actions/upload-cloud-storage@6397bd7208e18d13ba2619ee21b9873edc94427a # v3.0.0
        if: env.UPLOAD == 'true' && matrix.name == 'Windows'
        with:
          path: feed/manifest
          destination: ${{ vars.GCP_RELEASE_BUCKET }}/desktop/updates/win
          parent: false
          gzip: false
          process_gcloudignore: false
          # Public objects are cached for an hour by default; the manifest must not be.
          headers: |-
            cache-control: no-cache

      - name: List the files on the run page
        if: always()
        shell: bash
        run: |
          {
            echo "### ${{ matrix.name }}"
            if compgen -G "release/*.sha256" > /dev/null; then
              echo "| File | Size (bytes) | SHA-256 |"
              echo "| --- | --- | --- |"
              for checksum in release/*.sha256; do
                file=$(basename "${checksum%.sha256}")
                echo "| \`$file\` | $(wc -c < "release/$file" | tr -d ' ') | \`$(cut -d' ' -f1 "$checksum")\` |"
              done
            else
              echo "No installer was built. See the job log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Short documentation on every run's summary page: what the workflow does and how to run it.
  about:
    name: About this workflow
    needs: package
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Write the run summary
        shell: bash
        env:
          UPLOADED: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.package.result == 'success' }}
          BUCKET: ${{ vars.GCP_RELEASE_BUCKET }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Release workflow

          Builds the Swyft Finance desktop installers. For a version tag it also publishes them to Google Cloud Storage.

          **What it does**

          1. Builds the Windows installer (NSIS, x64) and the macOS disk images (Apple Silicon and Intel).
          2. On a `vX.Y.Z` tag: checks the tag matches the version in `apps/desktop/package.json`, then uploads each file with a `.sha256` to `desktop/<tag>/` in the release bucket.
          3. Publishes the Windows update feed (`desktop/updates/win/latest.yml`), which installed Windows apps check for new versions.

          **How to run it**

          - Release: set `version` in `apps/desktop/package.json`, merge to `master`, deploy the API first if the release needs API changes, then tag the merged commit and push the tag, e.g. `git tag -a v1.2.0 -m "Swyft Finance 1.2.0"` and `git push origin v1.2.0`.
          - Test build: Actions → Release → Run workflow. It builds everything but uploads nothing.

          EOF
          version="${GITHUB_REF_NAME#v}"
          base="https://storage.googleapis.com/$BUCKET/desktop/$GITHUB_REF_NAME"
          {
            echo "**This run**"
            echo
            if [ "$UPLOADED" = "true" ]; then
              echo "- Windows: [Swyft-Finance-$version-x64-Setup.exe]($base/Swyft-Finance-$version-x64-Setup.exe)"
              echo "- macOS Apple Silicon: [Swyft-Finance-$version-arm64.dmg]($base/Swyft-Finance-$version-arm64.dmg)"
              echo "- macOS Intel: [Swyft-Finance-$version-x64.dmg]($base/Swyft-Finance-$version-x64.dmg)"
              echo "- Checksums: the same links with \`.sha256\` added. Sizes and SHA-256 values are in the Windows and macOS sections on this page."
            elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "The build or upload failed, so this release may be incomplete. Check the failed job, fix it, then re-run the failed jobs."
            else
              echo "Test build from \`$GITHUB_REF_NAME\`: nothing was uploaded."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
